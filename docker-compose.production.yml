services:
  be:
    build:
      context: ./be
      dockerfile: Dockerfile.all
    image: nhan-su-be:latest
    container_name: nhan-su-be
    restart: unless-stopped
    ports:
      - "3030:3000"
    env_file:
      - ./be/env/db.env
      - ./be/env/jwt.env
      - ./be/env/services.env
    networks:
      - chimseo
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  fe:
    build:
      context: ./fe
      dockerfile: Dockerfile
    image: nhan-su-fe:latest
    container_name: nhan-su-fe
    restart: unless-stopped
    ports:
      - "8091:80"
    depends_on:
      - be
    networks:
      - chimseo

networks:
  chimseo:
    external: true
